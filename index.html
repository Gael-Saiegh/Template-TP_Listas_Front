<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <select id="filtro">
        <option value="">Todas las categorias</option>
        <option value="AA">AA</option>
      </select>
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
    <form id="agregarComidaForm">
<h2>Agregar Comida</h2>
<label for="nombre"> Nombre de la comida:</label>
<input type="text" id="nombre" placeholder="Nombre de la comida" required>

<label for="provincia">Provincia</label>
<input type="text" id="provincia" placeholder="provincia"  required>

<label for="categoría"></label>
<input type="text" id="categoría" placeholder="Categoría" required>

<label for="ingredientes"> Ingredientes (sepradados por coma):</label>
<input type="text" id="ingredientes" placeholder="Ingredientes" required>

<button type="submit">Agregar</button>

    </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
